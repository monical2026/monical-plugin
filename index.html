<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Tab Haven · 标签小憩</title></head>
<body>
<header class="topbar"><a class="brand" href="./index.html"><span class="brand-mark">H</span> Tab Haven <span class="brand-cn">标签小憩</span></a><span class="local-label"><i></i> 只在本机，安心整理</span></header>
<main>
<section class="hero" aria-labelledby="greeting"><div class="eyebrow">A LITTLE SPACE FOR YOUR MIND</div><h1 id="greeting">给浏览，留一点空间。</h1><p>从一次搜索开始，让打开的灵感各归其位。</p>
<form id="search" action="https://www.google.com/search" method="get" role="search"><span class="search-icon" aria-hidden="true">⌕</span><input name="q" id="web-query" aria-label="Google 搜索" placeholder="在 Google 上搜索，发现新的灵感" autocomplete="off" required><button type="submit" aria-label="提交 Google 搜索">↗</button></form>
<div class="search-caption">Google 搜索 <span>·</span> 也可以直接使用浏览器地址栏</div></section>
<section class="workspace" aria-labelledby="workspace-title"><div class="section-head"><div><div class="eyebrow">YOUR BROWSING SPACE</div><h2 id="workspace-title">打开的世界 <span id="total">0</span></h2><p id="summary">正在整理你的标签…</p></div><div class="tools"><label class="filter"><span aria-hidden="true">⌕</span><input id="filter" type="search" aria-label="查找已打开的标签" placeholder="查找已打开的标签"></label><button id="refresh" class="icon-button" aria-label="刷新标签" title="刷新标签">↻</button></div></div>
<div id="demo-note" class="demo-note" hidden>演示预览 · 以下为示例标签，操作不会影响真实浏览器。安装插件后会显示你的实际标签。</div>
<div id="duplicate-banner" class="duplicate-banner" hidden><span><strong id="duplicate-count"></strong><span class="banner-description"> 留一个就够了，让空间轻一点。</span></span><button id="review-duplicates">查看并清理 <span aria-hidden="true">→</span></button></div>
<div id="groups" class="groups"></div><div id="empty" class="empty" hidden><div>✧</div><h3>这里，刚刚好。</h3><p id="empty-text">暂时没有需要整理的标签，去发现点新东西吧。</p></div>
</section>
<footer><span>少一点堆积，多一点专注。</span><span>当前 Chrome 配置 · 所有普通窗口</span></footer>
</main>
<dialog id="confirm-dialog" aria-labelledby="dialog-title"><form method="dialog"><div class="dialog-symbol">↗</div><h2 id="dialog-title"></h2><p id="dialog-description"></p><div id="dialog-details"></div><div class="dialog-actions"><button value="cancel" class="secondary">先保留</button><button id="confirm-action" type="button" class="danger">确认关闭</button></div></form></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="/src/main.js"></script>
</body></html>
